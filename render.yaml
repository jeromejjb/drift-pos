services:
  # PostgreSQL Database
  - type: pserv
    name: drift-db
    plan: free
    region: oregon

  # API Backend - Web Service
  - type: web
    name: drift-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install && npm run build --workspace=apps/landing && npx prisma generate && npm run build
    startCommand: npm start
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drift-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DINER_URL
        value: https://drift-diner.onrender.com
      - key: RESTAURANT_URL
        value: https://drift-restaurant.onrender.com
      - key: LANDING_URL
        value: https://drift-landing.onrender.com

  # Diner Frontend - Static Site
  - type: static
    name: drift-diner
    plan: free
    region: oregon
    rootDir: apps/diner
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.driftpos.com
      - key: VITE_SUPABASE_URL
        value: https://kywpomnuqfypfgxagnib.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_DZd_H7Hcxw49NiWO7uAZgQ_goY2wMfN
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: pk_live_51T1PjSPpOz4d8LjO5Oz3CW61EcbgXS2U19GarkBl2LUxZr0YW6jlOZsYGLKd1UPaDbPqvZgIlvYvu8ZiOMM9QCrn00XjkX013S

  # Restaurant Frontend - Static Site
  - type: static
    name: drift-restaurant
    plan: free
    region: oregon
    rootDir: apps/restaurant
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.driftpos.com
      - key: VITE_SUPABASE_URL
        value: https://kywpomnuqfypfgxagnib.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_DZd_H7Hcxw49NiWO7uAZgQ_goY2wMfN

  # Landing Page - Static Site
  - type: static
    name: drift-landing
    plan: free
    region: oregon
    rootDir: apps/landing
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.driftpos.com
      - key: VITE_SUPABASE_URL
        value: https://kywpomnuqfypfgxagnib.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
